name: Build WordPress Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to build & deploy (e.g. 1.0.85)"
        required: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Exposed to step-level `if:` so the wp.org deploy is skipped (instead of
    # failing the whole build) until the SVN credentials are configured as secrets.
    env:
      HAS_SVN: ${{ secrets.SVN_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve plugin version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read xpressui version
        id: xpressui
        run: echo "version=$(cat xpressui-version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@lybaba"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for @lybaba/xpressui@${{ steps.xpressui.outputs.version }} on GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          XPRESSUI_VERSION: ${{ steps.xpressui.outputs.version }}
        run: |
          echo "Waiting for @lybaba/xpressui@${XPRESSUI_VERSION} to be available on GitHub Packages..."
          for i in $(seq 1 20); do
            if npm view @lybaba/xpressui@${XPRESSUI_VERSION} version 2>/dev/null | grep -qF "${XPRESSUI_VERSION}"; then
              echo "Package @lybaba/xpressui@${XPRESSUI_VERSION} is available."
              break
            fi
            echo "Attempt $i/20 — not available yet, retrying in 30s..."
            sleep 30
          done
          if ! npm view @lybaba/xpressui@${XPRESSUI_VERSION} version 2>/dev/null | grep -qF "${XPRESSUI_VERSION}"; then
            echo "ERROR: @lybaba/xpressui@${XPRESSUI_VERSION} did not appear after 10 minutes."
            exit 1
          fi

      - name: Fetch xpressui light runtime
        run: npm install @lybaba/xpressui@${{ steps.xpressui.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install runtime + apply WP.org patches
        run: python3 scripts/ci-install-runtime.py

      - name: Build plugin ZIP
        run: |
          ZIP_NAME="xpressui-bridge-${{ steps.version.outputs.version }}.zip"
          OUTPUT_PATH="$(bash scripts/build-package.sh "$ZIP_NAME")"
          cp "$OUTPUT_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      # --- WordPress.org SVN deploy -------------------------------------------
      # Deploys the *built* plugin (runtime + WP.org patches already applied) — the
      # repo checkout alone would be missing the bundled runtime. Skipped until the
      # SVN_USERNAME / SVN_PASSWORD secrets are set, so it never breaks the build.
      - name: Stage built plugin for SVN
        if: ${{ env.HAS_SVN == 'true' }}
        run: |
          rm -rf svn-build
          mkdir -p svn-build
          unzip -q "$ZIP_NAME" -d svn-build
          test -d svn-build/xpressui-bridge

      - name: Deploy to WordPress.org
        if: ${{ env.HAS_SVN == 'true' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: xpressui-bridge
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ./svn-build/xpressui-bridge
          ASSETS_DIR: .wordpress-org

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
