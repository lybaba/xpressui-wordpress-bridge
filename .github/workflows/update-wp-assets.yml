name: Update WordPress.org Assets

# Pushes only the directory assets (banner, icon, screenshots) from
# .wordpress-org/ to the plugin's SVN /assets/ folder. Assets are versionless on
# wordpress.org, so this never touches trunk/ or tags/ and needs no version bump.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update wordpress.org plugin assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: xpressui-bridge
          ASSETS_DIR: .wordpress-org
